<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Wallpaper Forge – video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #err { position: absolute; left: 24px; bottom: 24px; color: #fff; font: 14px system-ui, sans-serif;
         background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<video id="v" autoplay loop playsinline disablepictureinpicture></video>
<div id="err"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.getElementById('v');
  var err = document.getElementById('err');
  var fits = { cover: 'cover', contain: 'contain', stretch: 'fill' };

  function applyPlayback(o) {
    if (!o) return;
    if (typeof o.volume === 'number') video.volume = Math.max(0, Math.min(1, o.volume / 100));
    video.muted = o.volume === 0;
    if (typeof o.rate === 'number' && o.rate > 0) video.playbackRate = o.rate;
    video.style.objectFit = fits[o.fit] || 'cover';
  }

  video.src = params.get('src');
  applyPlayback(window.__wf ? window.__wf.state.playback : null);
  window.addEventListener('wf-playback', function (e) { applyPlayback(e.detail); });

  video.addEventListener('error', function () {
    var code = video.error ? video.error.code : '?';
    err.textContent = 'No se pudo reproducir el video (código ' + code + '). Probá convertirlo a MP4 H.264 o WebM.';
    err.style.display = 'block';
  });

  // Si el navegador bloquea el autoplay con sonido, se reintenta sin sonido.
  var p = video.play();
  if (p && p.catch) p.catch(function () { video.muted = true; video.play().catch(function () {}); });
})();
</script>
</body>
</html>
