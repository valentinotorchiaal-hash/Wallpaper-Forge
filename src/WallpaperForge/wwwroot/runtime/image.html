<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Wallpaper Forge – imagen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<img id="i" alt="" decoding="async">
<script>
/* Imagen o GIF de fondo. En pausa el WebView2 se suspende, así que el GIF también se detiene. */
(function () {
  var img = document.getElementById('i');
  var fits = { cover: 'cover', contain: 'contain', stretch: 'fill' };
  function applyPlayback(o) { if (o) img.style.objectFit = fits[o.fit] || 'cover'; }
  img.src = new URLSearchParams(location.search).get('src');
  applyPlayback(window.__wf ? window.__wf.state.playback : null);
  window.addEventListener('wf-playback', function (e) { applyPlayback(e.detail); });
})();
</script>
</body>
</html>
