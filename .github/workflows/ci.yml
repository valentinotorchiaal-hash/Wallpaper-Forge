name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (compilación, tests y autodiagnóstico)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build -c Release
      - name: Tests
        shell: pwsh
        run: |
          dotnet test tests/WallpaperForge.Tests -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=tests.trx" --results-directory testresults
          $code = $LASTEXITCODE
          # Cada test fallido como anotación (se ven sin permisos en la pestaña del commit).
          Get-ChildItem testresults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            foreach ($r in $x.TestRun.Results.UnitTestResult) {
              if ($r.outcome -ne 'Passed') {
                $m = ($r.Output.ErrorInfo.Message -replace "`r?`n", ' ')
                if ($m.Length -gt 400) { $m = $m.Substring(0, 400) }
                Write-Host "::error title=test $($r.testName)::$m"
              }
            }
          }
          exit $code
      - name: Publicar
        run: dotnet publish src/WallpaperForge -c Release -o publish
      - name: Autodiagnóstico en Windows (escritorio, WebView2, pausa, pantalla completa)
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\WallpaperForge.exe -ArgumentList '--selftest', "$PWD\selftest-result.json" -PassThru -Wait
          if (Test-Path selftest-result.json) {
            Get-Content selftest-result.json
            $r = Get-Content selftest-result.json -Raw | ConvertFrom-Json
            foreach ($c in $r.checks) {
              $d = ($c.detail -replace "`r?`n", ' ')
              if ($d.Length -gt 300) { $d = $d.Substring(0, 300) }
              if ($c.ok) { Write-Host "::notice title=selftest OK::$($c.name) $d" } else { Write-Host "::error title=selftest FAIL::$($c.name) $d" }
            }
          } else { Write-Host "::error title=selftest::Sin resultado (exit $($p.ExitCode))" }
          Get-ChildItem "$env:LOCALAPPDATA\WallpaperForge\logs" -ErrorAction SilentlyContinue | Get-Content
          exit $p.ExitCode
      - name: Instalador (script de instalación de punta a punta)
        shell: pwsh
        run: |
          # Una "versión vieja" abierta desde otra carpeta: el instalador y la app tienen que dejar sólo una.
          $old = Join-Path $env:USERPROFILE 'Downloads\wf-vieja'
          New-Item -ItemType Directory -Force $old | Out-Null
          Copy-Item publish\* $old -Recurse -Force
          Set-Content (Join-Path $old 'mio.txt') 'archivo del usuario: no se tiene que borrar'
          Start-Process (Join-Path $old 'WallpaperForge.exe'); Start-Sleep 5
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -Yes
          Start-Sleep 8
          $procs = Get-Process WallpaperForge -ErrorAction SilentlyContinue | ForEach-Object { $_.Path }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WallpaperForge\WallpaperForge.exe'
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').WallpaperForge
          $checks = @(
            @('instalado', (Test-Path $exe)),
            @('una sola instancia abierta', (@($procs).Count -eq 1)),
            @('la instancia abierta es la instalada', (@($procs)[0] -eq $exe)),
            @('copia vieja borrada', -not (Test-Path (Join-Path $old 'WallpaperForge.exe'))),
            @('archivo del usuario intacto', (Test-Path (Join-Path $old 'mio.txt'))),
            @('arranque con Windows apunta a la instalada', ($run -like "*$exe*"))
          )
          $fail = 0
          foreach ($c in $checks) {
            if ($c[1]) { Write-Host "::notice title=instalador OK::$($c[0])" } else { Write-Host "::error title=instalador FAIL::$($c[0]) (procesos: $($procs -join ', '); run: $run)"; $fail++ }
          }
          # La app sola (sin el script): abrir la instalada con otra copia corriendo debe cerrar la otra.
          Get-Process WallpaperForge -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          $old2 = Join-Path $env:TEMP 'wf-otra'
          New-Item -ItemType Directory -Force $old2 | Out-Null
          Copy-Item publish\* $old2 -Recurse -Force
          Start-Process (Join-Path $old2 'WallpaperForge.exe'); Start-Sleep 6
          Start-Process $exe; Start-Sleep 8
          $procs = @(Get-Process WallpaperForge -ErrorAction SilentlyContinue | ForEach-Object { $_.Path })
          if ($procs.Count -eq 1 -and $procs[0] -eq $exe) { Write-Host "::notice title=instalador OK::la versión abierta última reemplaza a otra copia" }
          else { Write-Host "::error title=instalador FAIL::la otra copia sigue abierta ($($procs -join ', '))"; $fail++ }
          Get-Process WallpaperForge -ErrorAction SilentlyContinue | Stop-Process -Force
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest-result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperForge-win-x64
          path: publish/

  runtime:
    name: Runtime web en Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generar escena de prueba
        run: WF_EXPORT_SCENE=$PWD/scene-out dotnet test tests/WallpaperForge.Tests
      - name: Instalar Playwright
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Tests del runtime
        run: node tests/runtime/runtime-test.js scene-out | sed -E 's/^FAIL (.*)$/::error title=runtime::\1/'; test ${PIPESTATUS[0]} -eq 0
      - name: Tests de la interfaz
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p media
          ffmpeg -loglevel error -y -f lavfi -i testsrc=size=160x90:rate=10 -t 1 media/anim.gif
          ffmpeg -loglevel error -y -f lavfi -i testsrc=size=320x180:rate=30 -t 3 -c:v libvpx-vp9 -b:v 200k media/clip.webm
          node tests/runtime/ui-test.js media 2>&1 | sed -E 's/^FAIL (.*)$/::error title=interfaz::\1/; s/^(Error|TypeError|.*Timeout.*)(.*)$/::error title=interfaz::\1\2/'; test ${PIPESTATUS[0]} -eq 0
